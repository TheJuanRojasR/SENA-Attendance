name: senaattendance

services:
  app:
    image: senaattendance
    container_name: senaattendance
    restart: unless-stopped

    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=dev,api-docs,secret-samples
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/senaAttendance

    ports:
      - '8080:8080'

    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /management/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"\\\"status\\\":\\\"UP\\\"\" <&3'"
      interval: 5s
      timeout: 5s
      retries: 40

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - mongo_network

  mongodb:
    extends:
      file: ./mongodb.yml
      service: mongodb

volumes:
  mongodb_data:
  mongodb_config:

networks:
  mongo_network:
    driver: bridge
